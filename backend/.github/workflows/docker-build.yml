name: Build and Push Docker Image

# Builds the training-system container image and pushes it to GHCR.
#
# Tags produced for every push to main / workflow_dispatch:
#   ghcr.io/ziruibai/training-system:latest
#   ghcr.io/ziruibai/training-system:sha-<full-commit-sha>
#   ghcr.io/ziruibai/training-system:sha-<short-sha>
#
# The login-security fix (enforced bcrypt password verification + demo login
# disabled in production) is part of the built image as of commit
# 5d6cbd2d91d7b4fadb822cdc2bce3d41e4699382.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        working-directory: .
        run: go test ./...

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: tags
        run: |
          FULL_SHA="${GITHUB_SHA}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          echo "full_sha=${FULL_SHA}"   >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.tags.outputs.full_sha }}
            ${{ steps.image.outputs.name }}:sha-${{ steps.tags.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.full_sha }}
            org.opencontainers.image.title=training-system

      - name: Image summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "- \`${{ steps.image.outputs.name }}:latest\`"
            echo "- \`${{ steps.image.outputs.name }}:sha-${{ steps.tags.outputs.full_sha }}\`"
            echo "- \`${{ steps.image.outputs.name }}:sha-${{ steps.tags.outputs.short_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"